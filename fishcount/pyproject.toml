[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fishcount"
version = "0.1.0"
description = "Local, offline fish detection and counting for folders of images."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
    "ultralytics>=8.3.78",
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "PyYAML>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-tqdm",
]

[project.scripts]
fishcount = "fishcount.cli:main"

[tool.setuptools]
packages = ["fishcount"]

[tool.setuptools.package-data]
fishcount = ["label_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fishcount", "helpers"]

[tool.mypy]
# python_version is left at the interpreter default: numpy's stubs need 3.12+
# syntax to parse. Ruff (target-version py310) keeps the code 3.10-compatible.
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*", "cv2"]
ignore_missing_imports = true
follow_imports = "skip"
