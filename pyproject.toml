[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herringnet"
version = "0.1.0"
description = "Fish detection and species classification for underwater camera trap data"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Gagan"},
]
readme = "README.md"

dependencies = [
    "ultralytics>=8.1.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "gradio>=4.0",
    "roboflow>=1.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
label = [
    "fiftyone>=0.23",
]
serve = [
    "datasette>=0.64",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "label-studio-sdk>=1.0",
]

[project.scripts]
herringnet = "cli.main:main"

[tool.setuptools.packages.find]
include = ["herringnet*", "cli*", "app*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring model weights (deselect with '-m not integration')",
]
